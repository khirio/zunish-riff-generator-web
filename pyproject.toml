[project]
name = "zunish-riff-generator"
version = "0.1.0"
description = "Infinite ZUN-style piano riff generator with real-time FluidSynth playback"
license = { text = "MPL-2.0" }
classifiers = [
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "mido>=1.3",
    "pyfluidsynth>=1.3",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
zunish = "zunish.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]
